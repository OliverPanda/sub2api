name: Auto Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: auto-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Require release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "Missing RELEASE_TOKEN. Configure a fine-grained PAT with Contents: Read and write." >&2
            exit 1
          fi

      - name: Checkout tested default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Plan patch release
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/release-tools/plan-auto-release.sh

      - name: Commit version and tag
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          NOTES: ${{ steps.plan.outputs.notes }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$VERSION" > backend/cmd/server/VERSION
          git add backend/cmd/server/VERSION
          if git diff --cached --quiet; then
            echo "VERSION already contains ${VERSION}"
          else
            git commit -m "chore(release): ${TAG}"
          fi
          git tag -a "$TAG" -m "release ${TAG}" -m "$NOTES"

      - name: Push main and tag atomically
        if: steps.plan.outputs.release == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/git-askpass"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "$RELEASE_TOKEN" ;;
          esac
          EOF
          chmod 0700 "$askpass"
          trap 'rm -f "$askpass"' EXIT

          GIT_ASKPASS="$askpass" \
          GIT_TERMINAL_PROMPT=0 \
            git push --atomic origin "HEAD:${DEFAULT_BRANCH}" "refs/tags/${TAG}"

      - name: Write release summary
        if: always()
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          {
            echo "## Automatic release"
            if [[ "$RELEASE" == "true" ]]; then
              echo "- ${PREVIOUS_TAG} → \`${TAG}\`"
              echo "- Next: Release builds both images; Deploy Production consumes the immutable digests."
            else
              echo "- No application release was created in this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
