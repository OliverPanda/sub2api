# Start with: docker compose --env-file .env -f compose.yml up -d
# Join Sub2API to this network, or attach this service to its existing network.
services:
  litellm:
    # Deploy a tested immutable image digest; local build override is available.
    image: ${LITELLM_IMAGE:?Set a tested LiteLLM 1.110.0 media image}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set an internal gateway key}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_API_BASE: ${ARK_API_BASE:-https://ark.cn-beijing.volces.com}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_API_BASE: ${MINIMAX_API_BASE:-https://api.minimax.io}
      FAL_KEY: ${FAL_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks: [media]
networks:
  media:
    name: sub2api-media
