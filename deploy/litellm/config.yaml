# The public aliases below are the models configured on the Sub2API account.
# Enable only models available to your credentials and verified in your LiteLLM release.
model_list:
  # Keep provider-qualified aliases: Sub2API uses their prefixes to validate
  # explicit quality tiers before reserving funds. Public aliases are mapped
  # on the Sub2API account, not renamed here.
  - model_name: volcengine/doubao-seedance-2-0-260128
    litellm_params:
      model: volcengine/doubao-seedance-2-0-260128
      api_key: os.environ/ARK_API_KEY
      api_base: os.environ/ARK_API_BASE
  - model_name: minimax/MiniMax-H3
    litellm_params:
      model: minimax/MiniMax-H3
      api_key: os.environ/MINIMAX_API_KEY
      api_base: os.environ/MINIMAX_API_BASE
  - model_name: minimax/MiniMax-H3-Max
    litellm_params:
      model: minimax/MiniMax-H3-Max
      api_key: os.environ/MINIMAX_API_KEY
      api_base: os.environ/MINIMAX_API_BASE
  - model_name: video-veo
    litellm_params:
      model: gemini/veo-3.0-generate-001
      api_key: os.environ/GEMINI_API_KEY
  - model_name: video-sora
    litellm_params:
      model: openai/sora-2
      api_key: os.environ/OPENAI_API_KEY
  - model_name: image-gpt
    litellm_params:
      model: openai/gpt-image-1
      api_key: os.environ/OPENAI_API_KEY
litellm_settings:
  # Surface unsupported parameters rather than silently losing requested options.
  drop_params: false
  num_retries: 0
router_settings:
  num_retries: 0
